version: 2

# Keep update PRs on the default branch (master), where stable fork releases live.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 10
    # Compile against the oldest supported Node API. Keep 22.x type updates,
    # but change the major deliberately when the minimum supported Node rises.
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
    assignees:
      - jhongturney
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      google-clients:
        patterns:
          - "@google-cloud/pubsub"
          - google-auth-library
          - googleapis
        update-types:
          - minor
          - patch
      runtime-maintenance:
        dependency-type: production
        patterns:
          - "*"
        exclude-patterns:
          - "@google-cloud/pubsub"
          - google-auth-library
          - googleapis
          - ffmpeg-for-homebridge
          - pick-port
          - werift
        update-types:
          - minor
          - patch
      development-maintenance:
        dependency-type: development
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    # Major upgrades remain individual PRs. Camera dependencies are excluded
    # from groups, not ignored: their updates still get individual review PRs.
    # Werift needs transport/camera testing. For pick-port, review API changes
    # and run the UDP allocation/stream-setup regressions before merging.

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    assignees:
      - jhongturney
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions-maintenance:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
