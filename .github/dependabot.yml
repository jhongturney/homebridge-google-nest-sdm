version: 2

# GitHub reads this file from the default branch (master). Version-update PRs
# target the maintained fork branch, which contains the installed fork releases.
# Update target-branch in both entries if development moves to a different branch.
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: fix/thermostat-event-reliability
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 10
    assignees:
      - jhongturney
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      google-clients:
        patterns:
          - "@google-cloud/pubsub"
          - google-auth-library
          - googleapis
        update-types:
          - minor
          - patch
      runtime-maintenance:
        dependency-type: production
        patterns:
          - "*"
        exclude-patterns:
          - "@google-cloud/pubsub"
          - google-auth-library
          - googleapis
          - ffmpeg-for-homebridge
          - pick-port
          - werift
        update-types:
          - minor
          - patch
      development-maintenance:
        dependency-type: development
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    # Major upgrades remain individual PRs. Camera dependencies are excluded
    # from groups, not ignored: their updates still get individual review PRs.
    # In particular, werift and pick-port need camera testing before merging.

  - package-ecosystem: github-actions
    directory: /
    target-branch: fix/thermostat-event-reliability
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    assignees:
      - jhongturney
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions-maintenance:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
