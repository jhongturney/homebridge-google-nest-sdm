name: CI

on:
  push:
  pull_request:
  workflow_call:
    inputs:
      release-bump:
        description: Optional version increment for release candidate testing
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node-version }} / Homebridge ${{ matrix.homebridge-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22.12.0
          - 24
          - 26
        homebridge-version:
          - 2.5.0

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Select Homebridge version
        run: npm install --no-save --ignore-scripts "homebridge@${{ matrix.homebridge-version }}"

      - name: Prepare release candidate version
        if: ${{ inputs.release-bump != '' }}
        env:
          BUMP: ${{ inputs.release-bump }}
        run: |
          case "$BUMP" in patch|minor|major) ;; *) exit 1 ;; esac
          npm version "$BUMP" --no-git-tag-version --ignore-scripts

      - name: Build and test
        run: npm test

      - name: Test installable package and plugin registration
        env:
          HOMEBRIDGE_VERSION: ${{ matrix.homebridge-version }}
        run: node scripts/package-smoke.cjs "$HOMEBRIDGE_VERSION"
